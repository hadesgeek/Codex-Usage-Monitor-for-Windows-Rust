[package]
name = "codex-usage-monitor"
version = "3.2.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "CodexUsageMonitor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
winreg = "0.55"
windows = { version = "0.62", features = [
  "ApplicationModel", "ApplicationModel_Core", "Foundation", "Management_Deployment", "Storage", "Storage_Search",
  "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs"
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
